name: Android CI

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - '!*-RuStore'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: temurin
          cache: gradle

      - name: Restore keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/keystore.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/keystore.jks" >> "$GITHUB_ENV"
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run unit tests & build release APKs
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          RELEASE_SIGN_KEY_ALIAS: ${{ secrets.RELEASE_SIGN_KEY_ALIAS }}
          RELEASE_SIGN_KEY_PASSWORD: ${{ secrets.RELEASE_SIGN_KEY_PASSWORD }}
        run: |
          ./gradlew testLiteDebugUnitTest assembleRelease bundleRelease --stacktrace

      - name: Release to RuStore
        if: startsWith(github.ref, 'refs/tags/') && env.KEY_ID != ''
        env:
          KEY_ID: ${{ secrets.RUSTORE_KEY_ID }}
          PRIVATE_KEY_BASE64: ${{ secrets.RUSTORE_KEY }}
        run: |
          APP_PACKAGE_NAME="top.rootu.lampa"
          APK_PATH="./app/build/outputs/apk/ruStore/release/app-ruStore-release.apk"
          API_VERSION="https://public-api.rustore.ru/public/v1/application/${APP_PACKAGE_NAME}/version"
          echo "$PRIVATE_KEY_BASE64" | base64 --decode > private_key.pem
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%S.%3NZ")
          MESSAGE="${KEY_ID}${TIMESTAMP}"
          SIGNATURE=$(echo -n "$MESSAGE" | openssl dgst -sha512 -sign private_key.pem | base64 -w 0)
          JSON_DATA="{\"keyId\":\"$KEY_ID\",\"timestamp\":\"$TIMESTAMP\",\"signature\":\"$SIGNATURE\"}"
          RESPONSE=$(curl --location --request POST 'https://public-api.rustore.ru/public/auth' \
            --header 'Content-Type: application/json' \
            --data "$JSON_DATA")
          CODE=$(echo "$RESPONSE" | jq -r '.code')
          if [ "$CODE" != "OK" ]; then
            echo "Error occurred: $(echo "$RESPONSE" | jq -r '.message')"
            exit 1
          fi
          JWT_TOKEN=$(echo "$RESPONSE" | jq -r '.body.jwe')
          RESPONSE=$(curl --location --request POST "${API_VERSION}" \
            --header "Public-Token: ${JWT_TOKEN}" \
            --header 'Content-Type: application/json' \
            --data "{}")
          CODE=$(echo "$RESPONSE" | jq -r '.code')
          if [ "$CODE" != "OK" ]; then
            echo "Error occurred: $(echo "$RESPONSE" | jq -r '.message')"
            exit 1
          fi
          VERSION_CODE=$(echo "$RESPONSE" | jq -r '.body')
          RESPONSE=$(curl --location --request POST "${API_VERSION}/${VERSION_CODE}/apk?servicesType=Unknown&isMainApk=true" \
            --header "Public-Token: ${JWT_TOKEN}" \
            --form "file=@\"${APK_PATH}\"")
          CODE=$(echo "$RESPONSE" | jq -r '.code')
          if [ "$CODE" != "OK" ]; then
            curl --location --request DELETE "${API_VERSION}/${VERSION_CODE}" \
              --header "Public-Token: ${JWT_TOKEN}" \
              --header 'Content-Type: application/json' \
              --data "{}"
            exit 1
          fi
          RESPONSE=$(curl --location --request POST "${API_VERSION}/${VERSION_CODE}/commit" \
            --header "Public-Token: ${JWT_TOKEN}")
          CODE=$(echo "$RESPONSE" | jq -r '.code')
          if [ "$CODE" != "OK" ]; then
            exit 1
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            app/build/outputs/apk/lite/release/app-lite-release.apk
            app/build/outputs/apk/full/release/app-full-release.apk
          draft: false
          make_latest: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
